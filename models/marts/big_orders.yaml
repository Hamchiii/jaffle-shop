models:
  - name: big_orders
    description: "Cleaned orders table sourced from raw data. This model filters orders with a total_amount greater than $100."
    columns:
      - name: order_id
        description: "Unique identifier for the order."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Identifier of the customer associated with the order."
        tests:
          - not_null
      - name: ordered_at
        description: "Date and time when the order was placed."
        tests:
          - not_null
      - name: order_total
        description: "Total amount of the order."
        tests:
          - not_null
