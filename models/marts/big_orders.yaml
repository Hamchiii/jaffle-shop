models:
  - name: orders_clean
    description: "Table des commandes nettoyées issue de la source raw. Ce modèle filtre les commandes dont le total_amount est supérieur à 100$."
    columns:
      - name: order_id
        description: "Identifiant unique de la commande."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Identifiant du client lié à la commande."
        tests:
          - not_null
      - name: ordered_at
        description: "Date et heure de la commande."
        tests:
          - not_null
      - name: order_total
        description: "Montant total de la commande."
        tests:
          - not_null